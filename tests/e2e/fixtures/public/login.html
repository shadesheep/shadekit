<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture Login</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <form id="login-form" method="post" action="/api/session/login">
        <p>
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" />
        </p>
        <p>
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
          />
        </p>
        <button id="submit-btn" type="submit">Sign in</button>
        <p id="login-error" role="alert" hidden></p>
      </form>
    </main>
    <script>
      const form = document.getElementById('login-form');
      const error = document.getElementById('login-error');

      // FORM-06：页面自带旧值，验证引擎的 clearFirst 后提交的是新值。
      if (new URLSearchParams(window.location.search).get('prefill') === '1') {
        document.getElementById('username').value = 'stale@fixture.test';
        document.getElementById('password').value = 'stale-pass';
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.hidden = true;
        error.textContent = '';

        try {
          const response = await fetch('/api/session/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              username: document.getElementById('username').value,
              password: document.getElementById('password').value,
            }),
          });
          if (response.ok) {
            // FORM-07：iframe 内提交成功后由顶层窗口进入控制台，避免只把
            // iframe 自身导航到 /console 而外层仍停留在登录壳页面。
            const target =
              window.top && window.top !== window.self
                ? window.top.location
                : window.location;
            target.assign('/console');
            return;
          }
          error.textContent = 'Invalid username or password';
        } catch {
          error.textContent = 'Login request failed';
        }
        error.hidden = false;
      });
    </script>
  </body>
</html>
