<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture Console</title>
  </head>
  <body data-current-role="{{role}}">
    <header>
      <strong id="current-account">{{name}}</strong>
    </header>
    <main>
      <dl>
        <dt>Name</dt>
        <dd id="identity-name">{{name}}</dd>
        <dt>Email</dt>
        <dd id="identity-email">{{email}}</dd>
        <dt>Title</dt>
        <dd id="identity-title">{{title}}</dd>
        <dt>Scope</dt>
        <dd id="identity-scope">{{scope}}</dd>
        <dt>Role</dt>
        <dd id="identity-role">{{role}}</dd>
      </dl>
    </main>
  </body>
</html>
