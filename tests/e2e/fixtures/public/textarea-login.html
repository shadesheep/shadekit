<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture Textarea Login</title>
  </head>
  <body>
    <main>
      <h1>Sign in (textarea)</h1>
      <form id="login-form" method="post" action="/api/session/login">
        <p>
          <label for="username">Username</label>
          <textarea id="username" name="username" rows="1"></textarea>
        </p>
        <p>
          <label for="password">Password</label>
          <textarea id="password" name="password" rows="1"></textarea>
        </p>
        <button id="submit-btn" type="submit">Sign in</button>
        <p id="login-error" role="alert" hidden></p>
      </form>
    </main>
    <script>
      const form = document.getElementById('login-form');
      const error = document.getElementById('login-error');
      // 提交模型只由 input/change 事件更新：直接改 value（不派发事件）不能登录，
      // 保证 FORM-03 的负向控制验证的是引擎的事件派发，而不是 fixture 偷读 DOM。
      const model = { username: '', password: '' };

      for (const field of form.querySelectorAll('textarea')) {
        const key = field.id;
        const sync = () => {
          model[key] = field.value;
        };
        field.addEventListener('input', sync);
        field.addEventListener('change', sync);
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.hidden = true;
        error.textContent = '';

        if (!model.username || !model.password) {
          error.textContent = 'Login fields were not updated';
          error.hidden = false;
          return;
        }

        try {
          const response = await fetch('/api/session/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(model),
          });
          if (response.ok) {
            window.location.assign('/console');
            return;
          }
          error.textContent = 'Invalid username or password';
        } catch {
          error.textContent = 'Login request failed';
        }
        error.hidden = false;
      });
    </script>
  </body>
</html>
