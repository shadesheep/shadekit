<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>ShadeKit 自动登录本地验收</title>
  <style>
    body { max-width: 760px; margin: 32px auto; font: 15px/1.5 system-ui; color: #172033; }
    form, .login-box { display: grid; gap: 10px; max-width: 360px; padding: 20px; margin: 16px 0; border: 1px solid #ccd4e0; border-radius: 10px; }
    input, button { padding: 8px; font: inherit; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    #status { padding: 12px; background: #ecfdf5; color: #166534; }
    iframe { width: 420px; height: 330px; border: 1px solid #ccd4e0; }
    code { background: #f1f5f9; padding: 2px 5px; }
  </style>
</head>
<body>
  <h1>自动登录本地虚构页面</h1>
  <p>仅用于手工验收。账号 <code>demo</code>，密码 <code>test-only-password</code>；不会发送网络请求。</p>
  <nav>
    <a href="?mode=standard">标准 form</a>
    <a href="?mode=noform">无 form 容器</a>
    <a href="?mode=iframe">iframe</a>
    <a href="?mode=incomplete">不完整</a>
    <a href="?mode=multiple">多表单</a>
    <a href="?mode=nopassword">永无密码框</a>
    <a href="?mode=reload">刷新后出现表单</a>
    <a href="?mode=locked">锁定选择器漂移</a>
  </nav>
  <div id="status" hidden>本地登录成功：表单已隐藏，URL 已变化。</div>
  <main id="content"></main>
  <script>
    const mode = new URLSearchParams(location.search).get('mode') || 'standard';
    const content = document.querySelector('#content');
    const status = document.querySelector('#status');
    function wireSubmit(root = document) {
      root.querySelectorAll('form, .login-box').forEach((form) => {
        form.addEventListener('submit', (event) => event.preventDefault());
        form.querySelector('button')?.addEventListener('click', (event) => {
          event.preventDefault();
          form.hidden = true;
          status.hidden = false;
          history.replaceState(null, '', '#logged-in');
        });
      });
    }
    function fields(idPrefix = '') {
      return `
        <label>用户名 <input id="${idPrefix}username" name="account" autocomplete="username" /></label>
        <label>密码 <input id="${idPrefix}password" name="password" type="password" autocomplete="current-password" /></label>
        <button id="${idPrefix}submit" type="submit">登录</button>`;
    }
    if (mode === 'iframe') {
      content.innerHTML = '<h2>主页面无密码框，登录在子 frame</h2><iframe src="auto-login-iframe.html"></iframe>';
    } else if (mode === 'incomplete') {
      content.innerHTML = '<form><label>密码 <input id="password" type="password" /></label></form><p>缺用户名和提交按钮，不应自动锁定或刷新。</p>';
    } else if (mode === 'multiple') {
      content.innerHTML = `<form>${fields('one-')}</form><form>${fields('two-')}</form><p>两个可见密码表单，应报歧义。</p>`;
    } else if (mode === 'nopassword') {
      content.innerHTML = '<h2>本地 Dashboard</h2><p>永远没有密码框；自动路径最多刷新一次后失败。</p>';
    } else if (mode === 'reload' && sessionStorage.getItem('auto-login-reload-seen') !== '1') {
      sessionStorage.setItem('auto-login-reload-seen', '1');
      content.innerHTML = '<h2>旧 Dashboard</h2><p>首次无密码框；自动刷新后本页会出现登录表单。</p>';
    } else if (mode === 'locked') {
      content.innerHTML = `<form>${fields('changed-')}</form><p>若锁定的是 #username / #password / #submit，应报具体定位失效且不改绑。</p>`;
    } else {
      const tag = mode === 'noform' ? 'div class="login-box"' : 'form';
      const close = mode === 'noform' ? 'div' : 'form';
      content.innerHTML = `<${tag}>${fields('')}</${close}>`;
      if (mode === 'reload') {
        const note = document.createElement('p');
        note.textContent = '这是自动刷新后出现的表单。';
        content.append(note);
      }
    }
    wireSubmit();
  </script>
</body>
</html>
