name: ✨ 功能建议
description: 提出新功能或改进建议
title: "[Feat] "
labels: [enhancement]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景/痛点
      description: 你想解决什么问题？现在的做法哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 希望扩展怎么做？有参考实现或竞品更好
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
